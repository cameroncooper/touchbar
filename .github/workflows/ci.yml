name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          grep -v '^#' .github/apt-packages.txt | grep -v '^$' \
            | xargs sudo apt-get install --no-install-recommends -y
      - name: Install toolchain components
        run: rustup component add rustfmt clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-check-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-check-
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      # touchbar-plugin-supervisor is excluded deliberately, not because its
      # tests are flaky. They assert real OS confinement: a delegated
      # user-owned cgroup, Landlock, seccomp, and a session bus. A hosted
      # runner provides none of those, so running them here would assert
      # nothing while reporting green.
      #
      # They are not skipped anywhere that matters. scripts/test-sandbox-
      # security.sh runs the complete suite, the ignored security campaigns,
      # the supervised component host, the permission CLI, and packaging on a
      # real session, and that is the release gate. See CONTRIBUTING.md.
      - name: Tests
        run: cargo test --workspace --exclude touchbar-plugin-supervisor
      # Fuzz targets live outside the workspace and have their own lockfile, so
      # a signature change there is invisible to the workspace build.
      - name: Fuzz targets compile
        run: cargo check --manifest-path fuzz/Cargo.toml --bins

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-bin
      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --locked
      - name: Audit workspace
        run: cargo audit
      - name: Audit fuzz targets
        run: cargo audit --file fuzz/Cargo.lock
