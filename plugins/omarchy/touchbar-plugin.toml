manifest_version = 1

[plugin]
name = "Omarchy"
version = "0.1.0"
description = "The Omarchy pixel field re-composed for the Touch Bar"
license = "MIT OR Apache-2.0"
source = "github:cameroncooper/touchbar-omarchy"
api = "^1.0"

[runtime]
kind = "component"
entrypoint = "component/plugin.wasm"
world = "touchbar:plugin/plugin@1.0.0"

# The drawing component and appearance provider are separate sandboxed workers.

[[items]]
id = "screensaver"
label = "Screensaver"
default_width = 2008
show_in_default_profile = false

[[items]]
id = "palette"
label = "Theme Palette"
show_in_default_profile = false

[[profile]]
id = "screensaver"
label = "Omarchy Screensaver"
items = ["screensaver"]
principal_item = "screensaver"
applications = ["org.omarchy.screensaver"]
# Omarchy's current image picker uses this namespace for both theme and
# background selection. A future purpose-specific theme-picker namespace can
# be added here without changing the host-side profile mechanism.
activities = ["omarchy-image-selector", "theme-change"]

[[appearance-provider]]
id = "omarchy"
label = "Omarchy"
entrypoint = "component/appearance-provider.wasm"
world = "touchbar:plugin/appearance-provider@1.0.0"
build_package = "touchbar-omarchy-appearance-provider"
desktop_sessions = ["omarchy"]
mounts = ["omarchy-runtime", "omarchy-current", "omarchy-user-themes", "omarchy-system-themes"]

[[permission]]
capability = "appearance.provide.v1"
required = true
reason = "Watch Omarchy theme selection and publish its semantic Touch Bar palette"

[permission.scope]
providers = ["omarchy"]
maximum_file_bytes = 65536
maximum_updates_per_second = 4

[[permission.scope.mounts]]
label = "omarchy-runtime"
suggested_location = "xdg-runtime:"

[[permission.scope.mounts]]
label = "omarchy-current"
suggested_location = "xdg-state:omarchy/current"

[[permission.scope.mounts]]
label = "omarchy-user-themes"
suggested_location = "xdg-config:omarchy/themes"

[[permission.scope.mounts]]
label = "omarchy-system-themes"
suggested_location = "system-data:omarchy/themes"
