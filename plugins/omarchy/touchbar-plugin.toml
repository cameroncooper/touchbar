manifest_version = 1

[plugin]
name = "Omarchy"
version = "0.1.0"
description = "The Omarchy pixel field re-composed for the Touch Bar"
license = "MIT OR Apache-2.0"
source = "github:cameroncooper/touchbar-omarchy"
api = "^1.0"

[runtime]
kind = "component"
entrypoint = "component/plugin.wasm"
world = "touchbar:plugin/plugin@1.0.0"

# The drawing component itself remains isolated. The package also contributes
# a declarative appearance provider below; touchbar-sessiond reads its one
# permission-bound palette file and remains the final appearance policy owner.

[[items]]
id = "screensaver"
label = "Screensaver"
default_width = 2008
show_in_default_profile = false

[[items]]
id = "palette"
label = "Theme Palette"
show_in_default_profile = false

[[profile]]
id = "screensaver"
label = "Omarchy Screensaver"
items = ["screensaver"]
principal_item = "screensaver"
applications = ["org.omarchy.screensaver"]
# Omarchy's current image picker uses this namespace for both theme and
# background selection. A future purpose-specific theme-picker namespace can
# be added here without changing the host-side profile mechanism.
activities = ["omarchy-image-selector", "theme-change"]

[[appearance-provider]]
id = "omarchy"
label = "Omarchy"
mount = "omarchy-current"
path = "theme/colors.toml"
desktop_sessions = ["omarchy"]

[appearance-provider.fields]
scheme = "mode"
background = "background"
foreground = "foreground"
accent = "accent"
selection = "selection"
muted = "muted"
destructive = "red"

[[permission]]
capability = "appearance.provide.v1"
required = false
reason = "Read the current Omarchy palette and offer it as the global Touch Bar appearance"

[permission.scope]
providers = ["omarchy"]
maximum_file_bytes = 65536
maximum_updates_per_second = 4

[[permission.scope.mounts]]
label = "omarchy-current"
suggested_location = "xdg-state:omarchy/current"
