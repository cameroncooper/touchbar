[[contribution]]
id = "contextual"
items = [{ plugin = "demo.beta", item = "shared", required = true }]

[[contribution]]
id = "optional"
items = [{ plugin = "demo.gamma", item = "extra", required = false }]

[[profile]]
id = "default"

