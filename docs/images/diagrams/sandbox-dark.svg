<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400"
     viewBox="0 0 860 400" role="img">
<rect width="860" height="400" fill="#0d1117"/>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/>
  </marker>
</defs>
<text x="430.0" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">What a third-party plugin can reach</text>
<rect x="40" y="56" width="200" height="150" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
<text x="60" y="84" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start">component.wasm</text>
<text x="60" y="108" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">no filesystem</text>
<text x="60" y="128" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">no network</text>
<text x="60" y="148" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">no D-Bus</text>
<text x="60" y="168" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">no environment</text>
<text x="60" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">no raw handles</text>
<line x1="240" y1="118" x2="314" y2="118" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)"/>
<text x="277" y="106" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">WIT</text>
<rect x="316" y="56" width="190" height="150" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="336" y="84" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start">plugin-host</text>
<text x="336" y="108" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">validates the UI tree</text>
<text x="336" y="128" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">owns text, layout,</text>
<text x="336" y="146" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">hit testing, GPU</text>
<text x="336" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">resource budgets</text>
<line x1="506" y1="118" x2="580" y2="118" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="582" y="56" width="238" height="150" rx="8" fill="#161b22" stroke="#db6d28" stroke-width="1.5"/>
<text x="602" y="84" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start">supervisor</text>
<text x="602" y="108" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">matches the exact grant</text>
<text x="602" y="128" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">before any work is queued</text>
<text x="602" y="154" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">namespaces · seccomp</text>
<text x="602" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">Landlock · cgroup budgets</text>
<text x="602" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#3fb950" text-anchor="start">append-only audit log</text>
<rect x="40" y="236" width="780" height="108" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="60" y="262" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="start">13 scoped capabilities, each denied until granted</text>
<text x="60" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">filesystem.read · filesystem.write · http.request · dbus.call · dbus.subscribe</text>
<text x="60" y="305" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">command.run · clipboard.read · clipboard.write · secret.read · uri.open</text>
<text x="60" y="324" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">notification.send · local.connect · context.read</text>
<text x="430.0" y="372" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="middle">A grant names the exact path, origin, bus member, or command template — never a whole subsystem.</text>
</svg>
