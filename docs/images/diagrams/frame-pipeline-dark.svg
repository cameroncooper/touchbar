<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250"
     viewBox="0 0 860 250" role="img">
<rect width="860" height="250" fill="#0d1117"/>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/>
  </marker>
</defs>
<text x="430.0" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">One composed frame</text>
<rect x="40" y="60" width="182" height="96" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="56" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start">plugin GLES</text>
<text x="56" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">each plugin renders</text>
<text x="56" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">into its own buffer</text>
<line x1="222" y1="108" x2="242" y2="108" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="246" y="60" width="182" height="96" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="262" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start">DMA-BUF</text>
<text x="262" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">handed over,</text>
<text x="262" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">never copied</text>
<line x1="428" y1="108" x2="448" y2="108" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="452" y="60" width="182" height="96" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="468" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start">composition</text>
<text x="468" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">one GPU pass,</text>
<text x="468" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">retained layers</text>
<line x1="634" y1="108" x2="654" y2="108" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="658" y="60" width="182" height="96" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="674" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start">swapchain</text>
<text x="674" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">presenter-owned,</text>
<text x="674" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">atomic flip</text>
<text x="430.0" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle">A late plugin never blocks the strip: its last completed buffer stays on screen.</text>
<text x="430.0" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="middle">Plugins render at 60 FPS. Physical presentation is currently ~29.9 Hz, a limit of the ADP kernel driver.</text>
</svg>
