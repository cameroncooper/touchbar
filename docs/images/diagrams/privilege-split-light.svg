<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470"
     viewBox="0 0 860 470" role="img">
<rect width="860" height="470" fill="#ffffff"/>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
  </marker>
</defs>
<text x="430.0" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Ownership is split at the login boundary</text>
<rect x="60" y="52" width="740" height="74" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="80" y="80" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">plugins</text>
<text x="80" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#656d76" text-anchor="start">sandboxed WebAssembly components · one process each</text>
<text x="780" y="80" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#1a7f37" text-anchor="end">no OS access</text>
<line x1="430" y1="126" x2="430" y2="168" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>
<text x="444" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#656d76" text-anchor="start">private Wayland · surfaces, DMA-BUF</text>
<rect x="60" y="170" width="740" height="108" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="80" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">touchbar-sessiond</text>
<text x="780" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#1a7f37" text-anchor="end">your user</text>
<text x="80" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#656d76" text-anchor="start">profiles · layout · themes · GPU composition · gestures</text>
<text x="80" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#656d76" text-anchor="start">no DRM master · no raw input · no uinput</text>
<text x="80" y="268" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#656d76" text-anchor="start">the canvas follows the attached panel</text>
<line x1="330" y1="278" x2="330" y2="330" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>
<text x="344" y="300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#656d76" text-anchor="start">final frames</text>
<line x1="600" y1="330" x2="600" y2="278" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>
<text x="614" y="300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#656d76" text-anchor="start">normalized touch + Fn</text>
<rect x="60" y="332" width="740" height="82" rx="8" fill="#fff8f0" stroke="#bc4c00" stroke-width="1.5"/>
<text x="80" y="360" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">touchbard</text>
<text x="780" y="360" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#bc4c00" text-anchor="end">root</text>
<text x="80" y="384" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#656d76" text-anchor="start">DRM · evdev · backlight · a uinput keyboard limited to fixed system keys</text>
<text x="80" y="404" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#656d76" text-anchor="start">keeps a media/Fn fallback when no session is attached</text>
<line x1="430" y1="414" x2="430" y2="442" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>
<text x="430.0" y="460" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#656d76" text-anchor="middle">Touch Bar</text>
</svg>
